services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATA_MODE: ${DATA_MODE:-mock}
      FORECAST_CACHE_TTL_SECONDS: ${FORECAST_CACHE_TTL_SECONDS:-10800}
      DATABASE_URL: sqlite:///./data/weather.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - weather-data:/workspace/apps/api/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  weather-data:
