databases:
  - name: weather-consensus-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: weather-consensus-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATA_MODE
        value: live
      - key: FORECAST_CACHE_TTL_SECONDS
        value: 10800
      - key: FORECAST_RETENTION_PAST_DAYS
        value: 0
      - key: DATABASE_URL
        value: sqlite:///./data/weather.db
      - key: LOG_LEVEL
        value: INFO
      - key: OPEN_METEO_BATCH_SIZE
        value: 1
      - key: OPEN_METEO_MAX_CONCURRENCY
        value: 1
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: weather-consensus-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: weather-consensus-web
    runtime: static
    buildCommand: cd apps/web && npm ci && npm run build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: weather-consensus-api-eu
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: weather-consensus-api-eu
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATA_MODE
        value: live
      - key: FORECAST_CACHE_TTL_SECONDS
        value: 10800
      - key: FORECAST_RETENTION_PAST_DAYS
        value: 0
      - key: DATABASE_URL
        fromDatabase:
          name: weather-consensus-db
          property: connectionString
      - key: LOG_LEVEL
        value: INFO
      - key: OPEN_METEO_BATCH_SIZE
        value: 1
      - key: OPEN_METEO_MAX_CONCURRENCY
        value: 1
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: weather-consensus-web
          envVarKey: RENDER_EXTERNAL_URL
